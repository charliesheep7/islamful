name: Verify reviewed SEO releases

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  deployment_status:

concurrency:
  group: canonical-seo-publisher
  cancel-in-progress: false

permissions:
  contents: write
  deployments: read

jobs:
  verify:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate reviewed assignments
        run: node --test tests/publishing-queue.mjs tests/article-publisher.mjs tests/release-readiness.mjs
      - name: Verify pending production articles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/verify-reviewed-release.mjs
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/seo/publishing-queue.json
          if [ -d data/seo/publications ]; then git add data/seo/publications/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record verified live SEO assignments'
            git push origin HEAD:main
          fi
